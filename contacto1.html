            <div class="caja">
                <h3> Escríbenos</h3>
                <form method="get" name="form1">
                <div class="datos">
                    <label>Nombre y Apellidos</label>
                    <input type="text" name="Usuario" size="25" maxlength="20"placeholder="Ingrese Usuario"required> <br>
                    <label for="">Celular</label>
                    <input type="tel"       
                    id="celular"            
                    name="celular" required 
                    pattern="[0-9]{9}" maxlength="9"              placeholder=""> <br> 
                    <label for="">Correo Electrónico</label>
                    <input type="email" name="Correo" placeholder="usuario@dominio.com" required><br>
                    <label for="">Ruc - Empresa (Opcional)</label>
                    <input type="text"   
                    id="ruc" name="ruc"  
                    pattern="[0-9]{11}" 
                    maxlength="11"       
                    inputmode="numeric"  
                    placeholder="">    
                    <label for="">Mensaje</label>
                    <textarea name="mensaje" rows="5" maxlength="500" placeholder=" Detalla tu experiencia a continuación como punto de inicio."></textarea>
                    <button type="submit">ENVIAR</button>

                </div> 
                </form>
